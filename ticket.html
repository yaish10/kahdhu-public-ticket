/* Passenger ticket card, shared by Finance → Tickets and Passengers. Copied from finance.css. */
/* Finance trips as tickets */
.ft-hero{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;padding:22px 26px;border-radius:24px;color:#fff;margin-bottom:14px;background:radial-gradient(90% 120% at 100% 0,rgba(6,182,212,.5),transparent 60%),linear-gradient(135deg,#4338ca,#6366f1 55%,#0ea5e9);box-shadow:0 22px 46px -26px rgba(67,56,202,.7)}

.ft-tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ft-chips{display:flex;gap:6px;flex-wrap:wrap}.ft-chips button{border:1px solid #e3e9f6;background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;color:#334155;cursor:pointer}.ft-chips button.on{background:#4f46e5;border-color:#4f46e5;color:#fff}

.ft-tool select{height:40px;border-radius:14px;border:1.5px solid #e3e9f6;background:#fff;padding:0 12px;font:inherit;font-size:13.5px;color:#0f2a55}
.ft-list{display:grid;gap:16px}
.ft{display:flex;text-decoration:none;color:#0b1f44;filter:drop-shadow(0 12px 18px rgba(30,41,120,.12));transition:transform .18s;}.ft:hover{transform:translateY(-3px)}
.ft-main{flex:1;min-width:0;position:relative;background:linear-gradient(135deg,#fff,#f5f8ff);border:1px solid #e1e8f5;border-right:0;border-radius:22px 0 0 22px;padding:16px 22px 14px;overflow:hidden}

.ft-top{position:relative;display:flex;align-items:center;gap:12px}.ft-code{font-weight:800;font-size:14px}.ft-sep{width:1px;height:20px;background:#c7d3ea}.ft-kind{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#475569}
.ft-st{margin-left:auto;font-size:12px;font-weight:800;padding:5px 12px;border-radius:10px;background:#e0e7ff;color:#3730a3}.ft-st.live{background:#d9f7e4;color:#12803f}.ft-st.done{background:#e2e8f0;color:#334155}.ft-st.warn{background:#ffedd5;color:#c2410c}.ft-st.bad{background:#fee2e2;color:#b91c1c}

.ft-end{display:flex;gap:8px;min-width:0}.ft-end svg{width:18px;height:22px;flex:none;color:#1677e8;margin-top:12px}.ft-end small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#475569}.ft-end b{display:block;font-size:clamp(17px,2vw,22px);line-height:1.15;letter-spacing:-.01em}
.ft-arrow{flex:0 0 36px;color:#1677e8}.ft-arrow svg{width:100%;height:20px}
.ft-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.ft-facts>div{display:flex;gap:8px;align-items:flex-start}.ft-facts svg{width:18px;height:18px;color:#475569;flex:none;margin-top:2px}.ft-facts small{display:block;font-size:11px;color:#475569}.ft-facts b{font-size:14px;white-space:nowrap}
.ft-occ{height:6px;border-radius:9px;background:#e5ebf7;margin-top:12px;overflow:hidden}.ft-occ i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#06b6d4);border-radius:9px}

.ft-split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ft-split b{display:block;font-size:14px}.ft-split b.pos{color:#12803f}.ft-split b.neg{color:#b91c1c}
.ft-go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:#4f46e5}.ft-go svg{width:14px;height:14px}

/* Trip tickets drawer */
button.ft{border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;width:100%}

.ftd-head{position:relative;padding:22px 26px 18px;color:#fff;background:radial-gradient(90% 120% at 100% 0,rgba(6,182,212,.5),transparent 60%),linear-gradient(135deg,#4338ca,#6366f1 55%,#0ea5e9)}

.ftd-head p{margin:0 0 14px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.ftd-x{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer}.ftd-x:hover{background:rgba(255,255,255,.3)}
.ftd-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.ftd-kpis>div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
.ftd-kpis small{display:block;text-transform:none;letter-spacing:0;font-size:12px}.ftd-kpis b{font-size:16px;text-shadow:0 1px 3px rgba(15,23,60,.3)}
.ftd-col{margin-top:12px}.ftd-colh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}.ftd-colh em{font-style:normal;font-weight:800}
.ftd-head .ft-occ{background:rgba(255,255,255,.25)}.ftd-head .ft-occ i{background:#fff}
.ftd-head .ft-st{background:rgba(255,255,255,.9)}
.ftd-tabs{display:flex;gap:6px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid #e3e9f6}
.ftd-tabs button{border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:#475569;padding:8px 14px;border-radius:12px;cursor:pointer}.ftd-tabs button.on{background:#eef2ff;color:#4338ca}.ftd-tabs b{margin-left:4px;font-size:12px;background:#e0e7ff;color:#4338ca;padding:1px 7px;border-radius:99px}
.ftd-tabs a{margin-left:auto;display:inline-flex;gap:4px;align-items:center;font-weight:700;font-size:13px;color:#4f46e5;text-decoration:none}.ftd-tabs a svg{width:14px;height:14px}
.ftd-body{flex:1;overflow:auto;padding:16px 20px 28px}
.ftd-tool{display:grid;gap:10px;margin-bottom:14px}.ftd-tool .ft-search{margin-left:0;width:100%}.ftd-tool .ft-search input{width:100%}
.ft-chips b{margin-left:4px;font-size:11.5px;opacity:.8}
.tkc-list{display:grid;gap:14px}
.tkc{display:flex;filter:drop-shadow(0 10px 16px rgba(30,41,120,.12))}
.tkc-main{flex:1;min-width:0;background:linear-gradient(135deg,#fff,#f6f9ff);border:1px solid #e1e8f5;border-right:0;border-radius:20px 0 0 20px;padding:14px 18px;display:grid;gap:10px}
.tkc-top{display:flex;align-items:center;gap:10px}.tkc-id{font-weight:800;font-size:15px;letter-spacing:.02em;color:#0b1f44;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tkc-pay{margin-left:auto;font-size:12px;font-weight:800;padding:4px 11px;border-radius:9px}.tkc-pay.paid{background:#d9f7e4;color:#12803f}.tkc-pay.part{background:#fef3c7;color:#b45309}.tkc-pay.unpaid{background:#ffedd5;color:#c2410c}.tkc-pay.ref{background:#fee2e2;color:#b91c1c}
.tkc-cust{display:flex;gap:10px;align-items:center}.tkc-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}

.tkc-row{display:flex;gap:22px;flex-wrap:wrap;padding-top:8px;border-top:1px solid #e6ecf7}.tkc-row small{display:block;font-size:11px;color:#475569;font-weight:600}.tkc-row b{font-size:14px;color:#0b1f44}
.tkc-seats{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}.tkc-seats i{font-style:normal;background:#dbeafe;color:#0b3a8a;font-weight:800;font-size:12.5px;padding:2px 9px;border-radius:7px}
.tkc-stub{position:relative;width:176px;flex:none;background:#fff;border:1px solid #e1e8f5;border-left:2px dashed #9db3d8;border-radius:0 20px 20px 0;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.tkc-n{position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:#f4f7fd;border:1px solid #e1e8f5}.tkc-n.t{top:-9px}.tkc-n.b{bottom:-9px}
.tkc-stub small{font-size:11px;color:#475569;font-weight:600}.tkc-amt{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#0b1f44}
.tkc-split{display:grid;gap:2px;font-size:12px;color:#475569;font-weight:600}.tkc-split b{color:#12803f}.tkc-split .due b{color:#c2410c}

.ftd-led{display:grid;gap:8px}.ftd-lr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid #e6ebf5;border-radius:16px;padding:12px 14px}
.ftd-lr strong{display:block;font-size:14px;color:#0b1f44}.ftd-lr small{color:#475569;font-size:12px}.ftd-lr b.pos{color:#12803f}.ftd-lr b.neg{color:#c2410c}
.ftd-lk{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px}.ftd-lk.in{background:#d9f7e4;color:#12803f}.ftd-lk.out{background:#ffedd5;color:#c2410c}.ftd-lk.ref{background:#fee2e2;color:#b91c1c}
@media(max-width:640px){.ftd-kpis{grid-template-columns:repeat(2,1fr)}.tkc{flex-direction:column}.tkc-main{border-right:1px solid #e1e8f5;border-radius:20px 20px 0 0}.tkc-stub{width:auto;border-left:1px solid #e1e8f5;border-top:2px dashed #9db3d8;border-radius:0 0 20px 20px;flex-direction:row;flex-wrap:wrap;align-items:center}.tkc-n{display:none}.tkc-print{margin-top:0;margin-left:auto}}

/* Trip ticket cards, matching the passenger ticket */
.ft2{filter:drop-shadow(0 14px 22px rgba(30,41,120,.14))}
.ft2 .ft-main{padding:16px 22px 14px;border-radius:26px 0 0 26px;background:linear-gradient(135deg,#fff,#f6f9ff)}

.ft-wave{position:absolute;top:0;left:0;right:0;height:70px;pointer-events:none}
.ft-top2{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ft-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;line-height:1.1;max-width:230px;color:#0b1f44}.ft-brand img,.ft-brand svg{height:34px;width:auto;flex:none;object-fit:contain}
.ft2 .ft-kind{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#475569}

.ft-badge svg{width:20px;height:20px}.ft-badge.live,.ft-badge.done{background:#d9f7e4;color:#12803f}.ft-badge.warn{background:#fff1d6;color:#b45309}.ft-badge.bad{background:#fee2e2;color:#b91c1c}

.ft2 .ft-stub small{font-size:11.5px;color:#475569}.ft-id{font-size:19px;font-weight:800;letter-spacing:-.01em;color:#0b1f44;text-align:left;margin:0 0 6px}.ft2 .ft-stub>small{text-align:left}
.ft-qr{width:112px;height:112px;margin:2px auto 0}.ft-qr svg{width:100%;height:100%;display:block}.ft-qr.ph{border:1px dashed #cbd5e1;display:grid;place-items:center;color:#94a3b8;font-size:12px}

.ft-paybox.pos{background:#d9f7e4;color:#16a34a}.ft-paybox.pos b{color:#0f5132}.ft-paybox.neg{background:#fff1d6;color:#d97706}.ft-paybox.neg b{color:#92400e}

.ft-qr svg{fill:none}

/* Passenger tickets list */
.ft.pk{cursor:default}
.pk-tabs button.on{background:#4f46e5}
.ft-badge.pay-paid{background:#d9f7e4;color:#12803f}.ft-badge.pay-part{background:#fef3c7;color:#b45309}.ft-badge.pay-unpaid{background:#ffedd5;color:#c2410c}.ft-badge.pay-ref{background:#fee2e2;color:#b91c1c}
.pk-cust{display:grid;grid-template-columns:1.4fr 1fr .5fr;gap:16px;padding-top:12px;margin-top:12px;border-top:1px solid #e6ecf7;align-items:start}

.pk-who em{font-style:normal;display:flex;gap:5px;align-items:center;font-size:12.5px;color:#334155}.pk-who em svg{width:13px;height:13px}.pk-n{font-size:20px;color:#0b1f44}
.ft-paybox.pk-part{background:#fff1d6;color:#d97706}.ft-paybox.pk-part b{color:#92400e}.ft-paybox.pk-unpaid{background:#ffedd5;color:#ea580c}.ft-paybox.pk-unpaid b{color:#9a3412}.ft-paybox.pk-ref{background:#fee2e2;color:#dc2626}.ft-paybox.pk-ref b{color:#991b1b}
.ft-paybox.pk-paid{background:#d9f7e4;color:#16a34a}.ft-paybox.pk-paid b{color:#0f5132}

@media(max-width:760px){.pk-cust{grid-template-columns:1fr 1fr}.pk-who{grid-column:1/-1}}

/* Tickets page: hero, views, day groups, board, list */
.tk-hero{align-items:center;padding:26px 30px;position:relative;overflow:hidden}

.ft2.pk{transition:transform .18s}.ft2.pk:hover{transform:translateY(-2px)}

/* Public customer ticket page — same card UI as Finance/Operations, no staff shell. */
html, body.tp-body { margin: 0; min-height: 100%; }
body.tp-body {
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #0b1f44;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(14, 165, 233, .16), transparent 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(99, 102, 241, .12), transparent 50%),
    linear-gradient(180deg, #f4f8ff, #e8f1fb);
}
.tp { width: min(980px, calc(100% - 28px)); margin: 28px auto 48px; }
.tp-load, .tp-msg {
  background: #fff;
  border: 1px solid #dbe5f4;
  border-radius: 18px;
  padding: 22px 20px;
  color: #64748b;
  text-align: center;
  box-shadow: 0 16px 36px -28px rgba(15, 23, 42, .45);
}
.tp-msg strong { display: block; color: #0b1f44; font-size: 18px; margin-bottom: 6px; }
.tp-msg.warn strong { color: #b45309; }
.tp-msg.bad strong { color: #b91c1c; }
.tp-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.tp-head img {
  width: 44px; height: 44px; border-radius: 12px; object-fit: contain;
  background: #fff; border: 1px solid #dbe5f4;
}
.tp-head b { font-size: 18px; letter-spacing: -.02em; }
.tp-head small {
  display: block; color: #64748b; font-size: 12px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
}
.tp .ft { max-width: 100%; }
.tp .ft:hover { transform: none; }
.tp-foot {
  margin-top: 16px; text-align: center; color: #64748b; font-size: 12.5px;
}
.tp-pax-list {
  margin-top: 14px; background: #fff; border: 1px solid #e1e8f5;
  border-radius: 18px; padding: 14px 16px;
  box-shadow: 0 10px 24px -20px rgba(15, 23, 42, .35);
}
.tp-pax-list h2 {
  margin: 0 0 10px; font-size: 12px; color: #64748b;
  text-transform: uppercase; letter-spacing: .04em;
}
.tp-pax-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tp-pax-list li {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  border: 1px solid #e6edf7; border-radius: 12px; padding: 10px 12px;
}
.tp-pax-list strong { display: block; }
.tp-pax-list em { font-style: normal; color: #64748b; font-size: 12.5px; }
.tp-seat {
  flex: none; background: #dbeafe; color: #0b3a8a; font-weight: 800;
  font-size: 12px; padding: 4px 9px; border-radius: 8px;
}
@media (max-width: 760px) {
  .tp { width: calc(100% - 20px); margin: 16px auto 36px; }
}

/* Pay outstanding */
.tp-pay {
  margin-top: 14px; background: #fff; border: 1px solid #e1e8f5; border-radius: 18px;
  padding: 16px; box-shadow: 0 10px 24px -20px rgba(15, 23, 42, .35);
}
.tp-pay-head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.tp-pay-head h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -.02em; }
.tp-pay-head p { margin: 0; color: #64748b; font-size: 13.5px; max-width: 46ch; }
.tp-pay-cta {
  border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-size: 14.5px; font-weight: 800;
  color: #fff; cursor: pointer; background: linear-gradient(135deg, #0b5ed7, #0ea5e9);
  box-shadow: 0 14px 28px -16px rgba(11, 94, 215, .75);
}
.tp-pay-cta:disabled { opacity: .55; cursor: default; }
.tp-pay-panel { margin-top: 14px; display: grid; gap: 12px; }
.tp-pay-h { margin: 4px 0 0; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: .04em; }
.tp-pay-none { margin: 0; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 12px 14px; }
.tp-accts { display: grid; gap: 10px; }
.tp-acct {
  display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px;
  border: 2px solid #e3e9f6; background: #f8faff; cursor: pointer;
}
.tp-acct.on { border-color: #0b5ed7; background: linear-gradient(135deg, #f5f9ff, #eef9ff); }
.tp-bk {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: #dbeafe; color: #0b3a8a; flex: none;
}
.tp-bk svg { width: 20px; height: 20px; }
.tp-ai { min-width: 0; flex: 1; }
.tp-ai strong { display: block; }
.tp-ai small, .tp-ai em { display: block; color: #64748b; font-size: 12.5px; font-style: normal; }
.tp-ai code { display: inline-block; margin-top: 4px; font-weight: 800; letter-spacing: .02em; }
.tp-copy {
  border: 1px solid #dbe5f4; background: #fff; border-radius: 999px; padding: 8px 12px;
  display: inline-flex; gap: 6px; align-items: center; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.tp-copy svg { width: 14px; height: 14px; }
.tp-copy.ok { color: #15803d; border-color: #bbf7d0; background: #f0fdf4; }
.tp-drop {
  display: grid; justify-items: center; gap: 4px; text-align: center; padding: 20px 16px;
  border: 2px dashed #c7d2fe; border-radius: 18px; background: #f8faff; cursor: pointer;
}
.tp-drop.over, .tp-drop:hover { background: #eef2ff; border-color: #0b5ed7; }
.tp-drop input { display: none; }
.tp-drop svg { width: 22px; height: 22px; color: #0b5ed7; }
.tp-drop strong { font-size: 14.5px; color: #0b1f44; }
.tp-drop small { color: #64748b; font-size: 12.5px; }
.tp-prev { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #e1e8f5; }
.tp-prev img { display: block; width: 100%; max-height: 220px; object-fit: contain; background: #0b1f44; }
.tp-prog {
  position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,.92);
  border-radius: 999px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700;
}
.tp-prog i { display: block; height: 6px; border-radius: 99px; background: #0b5ed7; flex: 1; max-width: 55%; }
.tp-read h3 { margin: 8px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tp-read h3 small { color: #64748b; font-weight: 600; }
.tp-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tp-fld { display: grid; gap: 4px; font-size: 12.5px; font-weight: 700; color: #475569; }
.tp-fld input, .tp-fld select {
  border: 1.5px solid #e3e9f6; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; color: #0b1f44; background: #fff;
}
.tp-checks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.tp-checks li {
  display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: 12px;
  font-size: 13px; line-height: 1.35; font-weight: 600;
}
.tp-checks i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.tp-checks i svg { width: 12px; height: 12px; }
.tp-checks .pass { background: #f0fdf4; color: #14532d; }
.tp-checks .pass i { background: #bbf7d0; color: #15803d; }
.tp-checks .warn { background: #fffbeb; color: #78350f; }
.tp-checks .warn i { background: #fde68a; color: #b45309; }
.tp-checks .fail { background: #fef2f2; color: #7f1d1d; }
.tp-checks .fail i { background: #fecaca; color: #b91c1c; }
.tp-pay-msg { margin: 0; min-height: 1.2em; color: #64748b; font-size: 13px; font-weight: 600; }
.tp-pay-msg.err { color: #b91c1c; }
.tp-pay-msg.ok { color: #15803d; }
.tp-pay-res {
  border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; margin-bottom: 10px;
}
.tp-pay-res strong { font-size: 16px; }
.tp-pay-res.verified, .tp-pay-res.ok { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }
.tp-pay-res.review { background: #fffbeb; color: #78350f; border: 1px solid #fde68a; }
.tp-pay-res.rejected { background: #fef2f2; color: #7f1d1d; border: 1px solid #fecaca; }

      }).join("") : '<li><div><strong>No passenger names yet</strong><em>Contact the operator if this looks wrong.</em></div></li>') +
      '</ul></section>';

    var payBlock = "";
    if (pay.can_pay && due > 0) {
      payBlock = '<section class="tp-pay" id="tpPay">' +
        '<div class="tp-pay-head"><div><h2>Pay outstanding</h2><p>Transfer ' + esc(money(due)) + ' to this company, then upload your bank slip. We scan it the same way as KAHDHU subscription payments.</p></div>' +
          '<button type="button" class="tp-pay-cta" id="tpPayOpen">Pay outstanding · ' + esc(money(due)) + '</button></div>' +
        '<div id="tpPayPanel" class="tp-pay-panel" hidden></div></section>';
    } else if (pay.slip && pay.slip.status && pay.slip.status !== "none") {
      var st = pay.slip.status;
      payBlock = '<section class="tp-pay"><div class="tp-pay-res ' + esc(st) + '"><strong>' +
        (st === "verified" || pay.slip.applied ? "Payment received" : st === "review" ? "Slip under review" : "Slip not accepted") +
        '</strong><span>' +
        (st === "verified" || pay.slip.applied ? "This ticket is marked paid." : st === "review" ? "The company will check your slip shortly." : "Upload a clearer slip or pay into the correct company account.") +
        '</span></div>' + checksHtml(pay.slip.checks || []) +
        (st === "rejected" ? '<button type="button" class="tp-pay-cta" id="tpPayOpen">Try again</button>' : "") +
        '</section>';
    }

    root.innerHTML = head + card + paxBlock + payBlock +
      '<p class="tp-foot">This page only shows your booking. It does not open company staff tools.</p>';

    var openBtn = document.getElementById("tpPayOpen");
    if (openBtn) openBtn.addEventListener("click", function () { openPay(d); });
  }

  function openPay(d) {
    var panel = document.getElementById("tpPayPanel");
    var openBtn = document.getElementById("tpPayOpen");
    if (!panel) return;
    if (openBtn) openBtn.hidden = true;
    panel.hidden = false;

    var S = {
      accounts: (d.pay && d.pay.accounts) || [],
      acct: null,
      file: null,
      preview: "",
      fields: null,
      checks: [],
      reading: 0,
      busy: false,
      booking: d.booking || {},
      company: d.company || {},
      due: Number(d.pay && d.pay.amount_due) || 0,
      currency: (d.pay && d.pay.currency) || "MVR"
    };
    if (S.accounts[0]) S.acct = S.accounts[0].id;

    function acctObj() {
      return S.accounts.filter(function (a) { return a.id === S.acct; })[0];
    }
    function say(t, kind) {
      var el = document.getElementById("tpPayMsg");
      if (el) { el.textContent = t || ""; el.className = "tp-pay-msg" + (kind ? " " + kind : ""); }
    }
    function recheck() {
      var a = acctObj();
      if (!S.fields || !a || !window.VeyoraSlip) { S.checks = []; return; }
      S.checks = window.VeyoraSlip.check(S.fields, {
        amount: S.due,
        currency: S.currency,
        account_no: a.account_no,
        bank: a.bank,
        createdAt: S.booking.created_at,
        amountLabel: "amount due",
        matchLabel: "covers the outstanding balance.",
        beforeLabel: "this booking was created.",
        afterLabel: "Transfer made after the booking was created."
      });
    }
    function fieldsHtml() {
      var f = S.fields;
      if (!f) return "";
      function inp(k, label, ph) {
        return '<label class="tp-fld"><span>' + label + '</span><input data-f="' + k + '" value="' + esc(f[k] || "") + '" placeholder="' + ph + '" autocomplete="off"></label>';
      }
      return '<div class="tp-read"><h3>What we read on your slip <small>' + esc([f.bank, f.transaction_type].filter(Boolean).join(" · ") || "Fix anything that is wrong") + '</small></h3><div class="tp-fields">' +
        inp("amount", "Amount", "0.00") + inp("to_account", "Paid to account", "Account number") +
        inp("reference_no", "Reference", "Reference or Id#") + inp("transaction_date", "Date and time", "YYYY-MM-DD HH:MM:SS") +
        '<label class="tp-fld"><span>Status</span><select data-f="status"><option value="">Not read</option><option value="SUCCESS"' + (/succ|compl/i.test(f.status || "") ? " selected" : "") + '>Success</option><option value="FAILED"' + (/fail/i.test(f.status || "") ? " selected" : "") + '>Failed</option></select></label>' +
        '<label class="tp-fld"><span>Bank</span><input data-f="bank" value="' + esc(f.bank || "") + '" placeholder="MIB or BML" autocomplete="off"></label></div><div id="tpChecks"></div></div>';
    }
    function paintChecks() {
      var el = document.getElementById("tpChecks");
      if (el) el.innerHTML = checksHtml(S.checks);
      var btn = document.getElementById("tpPaySubmit");
      if (btn) {
        var v = S.checks.length && window.VeyoraSlip ? window.VeyoraSlip.verdict(S.checks) : "none";
        btn.disabled = S.busy || !S.file || v === "rejected" || v === "none";
        btn.textContent = v === "rejected" ? "Fix the problems above" : v === "review" ? "Submit for review" : "Submit slip";
      }
    }
    function drawPay() {
      panel.innerHTML =
        (S.accounts.length
          ? '<h3 class="tp-pay-h">1. Transfer to this company account</h3><div class="tp-accts" role="radiogroup">' + S.accounts.map(function (x) {
              return '<div class="tp-acct' + (x.id === S.acct ? " on" : "") + '" role="radio" tabindex="0" data-acct="' + esc(x.id) + '">' +
                '<span class="tp-bk">' + ic(ICO.bank) + '</span><span class="tp-ai"><strong>' + esc(x.bank) + '</strong><small>' + esc(x.account_name) + '</small><code>' + esc(x.account_no) + '</code>' +
                (x.note ? '<em>' + esc(x.note) + '</em>' : "") + '</span>' +
                '<button type="button" class="tp-copy" data-copy="' + esc(x.account_no) + '">' + ic(ICO.copy) + '<span>Copy</span></button></div>';
            }).join("") + "</div>"
          : '<p class="tp-pay-none">This company has not published a receiving account yet. Contact the operator to pay.</p>') +
        '<h3 class="tp-pay-h">2. Upload your transfer slip</h3>' +
        '<label class="tp-drop" id="tpDrop"><input type="file" id="tpFile" accept="image/png,image/jpeg,image/webp">' +
          '<span>' + ic(ICO.up) + '</span><strong>' + (S.file ? "Choose a different slip" : "Drop your slip here or click to choose") + '</strong>' +
          '<small>Screenshot or photo · PNG, JPG or WebP · up to 8 MB</small></label>' +
        '<div id="tpReadBox">' + (S.preview ? '<div class="tp-prev"><img src="' + esc(S.preview) + '" alt="Your slip"><div class="tp-prog" id="tpProg"' + (S.reading ? "" : " hidden") + '><i style="width:' + Math.round((S.reading || 0) * 100) + '%"></i><span>Reading your slip…</span></div></div>' : "") +
          fieldsHtml() + "</div>" +
        '<button type="button" class="tp-pay-cta" id="tpPaySubmit" disabled>Submit slip</button>' +
        '<p class="tp-pay-msg" id="tpPayMsg" role="status"></p>';

      paintChecks();
      [].forEach.call(panel.querySelectorAll("[data-acct]"), function (el) {
        el.addEventListener("click", function (e) {
          if (e.target.closest("[data-copy]")) return;
          S.acct = el.getAttribute("data-acct");
          recheck();
          drawPay();
        });
      });
      [].forEach.call(panel.querySelectorAll("[data-copy]"), function (b) {
        b.addEventListener("click", function () {
          var t = b.getAttribute("data-copy");
          var done = function () { b.classList.add("ok"); b.querySelector("span").textContent = "Copied"; setTimeout(function () { b.classList.remove("ok"); b.querySelector("span").textContent = "Copy"; }, 1200); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done); else done();
        });
      });
      var drop = document.getElementById("tpDrop"), file = document.getElementById("tpFile");
      if (drop && file) {
        ["dragover", "dragenter"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
        ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
        drop.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files[0]) takeFile(e.dataTransfer.files[0]); });
        file.addEventListener("change", function () { if (file.files[0]) takeFile(file.files[0]); });
      }
      [].forEach.call(panel.querySelectorAll("[data-f]"), function (el) {
        el.addEventListener("input", function () { S.fields[el.getAttribute("data-f")] = el.value.trim(); recheck(); paintChecks(); });
        el.addEventListener("change", function () { S.fields[el.getAttribute("data-f")] = el.value.trim(); recheck(); paintChecks(); });
      });
      var sub = document.getElementById("tpPaySubmit");
      if (sub) sub.addEventListener("click", submit);
    }

    function takeFile(f) {
      if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { say("Use a PNG, JPG or WebP image of the slip.", "err"); return; }
      if (f.size > 8 * 1024 * 1024) { say("That image is over 8 MB.", "err"); return; }
      S.file = f; S.fields = null; S.checks = []; S.reading = 0.02;
      try { if (S.preview) URL.revokeObjectURL(S.preview); } catch (e) {}
      S.preview = URL.createObjectURL(f);
      drawPay();
      slipLib().then(function (L) {
        return L.read(f, function (p) {
          S.reading = Math.max(0.05, p);
          var bar = document.querySelector("#tpProg i");
          if (bar) bar.style.width = Math.round(p * 100) + "%";
        });
      }).then(function (res) {
        S.reading = 0; S.fields = res.fields; recheck(); drawPay();
        if (!S.fields.amount && !S.fields.reference_no && !S.fields.to_account) {
          say("We could not read this image. Try a clearer screenshot of the slip.", "err");
        }
      }, function (e) {
        S.reading = 0; S.fields = {}; recheck(); drawPay();
        say((e && e.message) || "Could not read the slip. Fill the details in by hand.", "err");
      });
    }

    function submit() {
      if (S.busy || !S.file || !S.fields || !S.acct) return;
      if (!S.booking.id || !S.company.id) { say("Ticket details are incomplete. Refresh and try again.", "err"); return; }
      S.busy = true; paintChecks(); say("Uploading your slip…");
      var ext = S.file.type === "image/png" ? "png" : S.file.type === "image/webp" ? "webp" : "jpg";
      var path = S.company.id + "/" + S.booking.id + "/" + Date.now() + "." + ext;
      Promise.resolve(db.storage.from("booking-slips").upload(path, S.file, { contentType: S.file.type, upsert: false })).then(function (up) {
        if (up.error) throw new Error(up.error.message);
        return db.rpc("public_ticket_submit_slip", {
          p_ref: ref,
          p_token: token,
          p_account: S.acct,
          p_path: path,
          p_ocr: S.fields
        });
      }).then(function (r) {
        S.busy = false;
        if (r.error) { say(r.error.message, "err"); paintChecks(); return; }
        var out = r.data || {};
        if (out.applied) {
          say("Payment verified. Reloading your ticket…", "ok");
          setTimeout(function () { reload(); }, 1200);
          return;
        }
        panel.innerHTML = '<div class="tp-pay-res ' + esc(out.slip_status || "") + '"><strong>' +
          (out.slip_status === "review" ? "Slip received for review" : out.slip_status === "rejected" ? "Slip not accepted" : "Slip received") +
          '</strong><span>' +
          (out.slip_status === "review" ? "Some details need a person to check. The company will update this ticket soon." :
            out.slip_status === "rejected" ? "Fix the problems below and try again with the correct company account." : "Thank you.") +
          '</span></div>' + checksHtml(out.checks || []) +
          (out.slip_status === "rejected" ? '<button type="button" class="tp-pay-cta" id="tpPayRetry">Upload another slip</button>' : "");
        var retry = document.getElementById("tpPayRetry");
        if (retry) retry.addEventListener("click", function () {
          S.file = null; S.fields = null; S.checks = []; S.preview = ""; drawPay();
        });
      }, function (e) {
        S.busy = false; say(e.message || "Upload failed.", "err"); paintChecks();
      });
    }

    if (!S.accounts.length) {
      panel.innerHTML = '<p class="tp-pay-none">This company has not published a receiving account yet. Ask the operator for their bank details.</p>';
      return;
    }
    drawPay();
  }

  function reload() {
    root.innerHTML = '<p class="tp-load">Opening your ticket…</p>';
    loadTicket().then(function (r) {
      if (r.error) {
        var miss = /public_ticket_view|schema cache|does not exist/i.test(r.error.message || "");
        msg("Could not open ticket", miss ? "Run migration 0154_public_ticket_pay_slip.sql, then try again." : r.error.message, "bad");
        return;
      }
      render(r.data || {});
    }, function (e) {
      msg("Could not open ticket", (e && e.message) || "Try again later.", "bad");
    });
  }

  reload();
})();

  </script>
</body>
